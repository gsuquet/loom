<style>
/* Layout: a work desk. Top bar, one sectioned list that holds the focus, detail beside it, key legend and connector health at the bottom. */

  --accent: #58c1cf; --accent-ink: #0b1a1e; --select: #1f3b42;
  --urgent: #ff8f83; --warn: #e4b95a; --ok: #79cf95;
  --a: #58c1cf; --b: #bd9cec; --p: #a5c987; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #12181b; --panel: #1a2226; --sunk: #232d32; --fg: #e7edef; --muted: #9dadb5; --line: #33424a;
  --accent: #58c1cf; --accent-ink: #0b1a1e; --select: #1f3b42;
  --urgent: #ff8f83; --warn: #e4b95a; --ok: #79cf95;

}
* { box-sizing: border-box; }
[hidden] { display: none !important; }

.list .row .what { display: flex; flex-direction: column-reverse; }

:root:not([data-keys="shown"]) .bar kbd, :root:not([data-keys="shown"]) .modal kbd { display: inline-block; }

.nav b.quiet { color: var(--muted); font-weight: 400; }

.foot .summary { flex-basis: 100%; font-size: 13px; color: var(--muted); }
.foot .summary button { color: var(--urgent); font-weight: 600; text-decoration: underline; }

.wrap { display: flex; flex-direction: column; gap: 12px; padding-block: 14px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; }

.try { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 18px; padding: 10px 12px; background: var(--sunk); border-radius: 6px; }

.list { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.sec { display: flex; justify-content: space-between; gap: 8px; padding: 8px 12px 4px; font-size: 12px; font-weight: 600; letter-spacing: 0.03em; text-transform: uppercase; color: var(--muted); border-top: 1px solid var(--line); }
.sec:first-child { border-top: 0; }
.row { display: grid; width: 100%; grid-template-columns: 16px 104px minmax(0, 1fr) minmax(0, 190px); gap: 2px 10px; align-items: baseline; padding: 7px 12px; }
.row:hover { background: var(--sunk); }

.what { min-width: 0; }
.what .kind { display: block; font-size: 12px; color: var(--muted); }
.title { font-weight: 500; }

.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 12px; background: var(--panel); border: 1px solid var(--accent); border-radius: 6px; }
.bar input { flex: 1 1 220px; min-width: 0; padding: 6px 8px; font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 4px; }

.desk.split { grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); }

  else if (kk0 === 'w' && page !== 'task') { if (['today', 'inbox', 'reviews', 'agents', 'library', 'meetings', 'day'].indexOf(page) >= 0) cycleFilter(); else toast('The context filter works on lists.'); }
  else if (page === 'review' && /^(j|k|n|p|ArrowDown|ArrowUp)$/.test(key)) reviewMove(key);
  else if (key === 'j' || key === 'ArrowDown') move(1);
  else if (key === 'k' || key === 'ArrowUp') move(-1);
  else if (key === 'n') jump(1);
  else if (key === 'p') jump(-1);
  else if (page === 'day') actDay(key);
  else if (page === 'reviews') actReviews(key);
  else if (page === 'agents') actAgents(key);
  else if (page === 'pages') actPages(key);
  else if (page === 'settings') actSettings(key);
  else if (page === 'later') actLater(key);
  else if (page === 'outbox') actOutbox(key);
  else if (page === 'meetings') actMeetings(key);
  else if (page === 'meeting') actMeeting(key);
  else if (page === 'library') actLibrary(key);
  else if (page === 'knowledge') actKnowledge(key);
  else if (page === 'run') actRun(key);
  else if (page === 'review') reviewKey(key);
  else if (page === 'task') actTask(key);
  else if (page === 'today' && key === 'v') { var curSel = byId(s.selected); if (curSel && sectionOf(curSel) === 'urgent') { toast('Urgent does not fold.'); } else if (curSel && sectionOf(curSel)) { s.collapsed[sectionOf(curSel)] = true; render(); } }
  else if (page === 'today' && key === 'V') { s.collapsed = {}; render(); }
  else if (page === 'today') actToday(key);
  else if (e.key === 'x') {
    if (entryById(s.cursor) && !s.inbox[s.cursor]) { togglePick(s.cursor); move(1); }
  } else if (e.key === 'X') {
    var cur = entryById(s.cursor);
    if (cur) {
      var group = openEntries().filter(function (x) { return x.group === cur.group; });
      var allOn = group.every(function (x) { return s.picked[x.id]; });
      group.forEach(function (x) { if (allOn) delete s.picked[x.id]; else s.picked[x.id] = true; });
      render();
    }
  } else if (e.key === 'Escape') { s.picked = {}; toast('Selection cleared.'); render(); }
  else triage(e.key);
});
$('list').addEventListener('click', function (e) {
  var foldEl = e.target.closest('[data-fold]');
  if (foldEl) { var fid = foldEl.getAttribute('data-fold'); if (s.collapsed[fid]) delete s.collapsed[fid]; else s.collapsed[fid] = true; render(); return; }
  if (e.target.closest('[data-short]')) { openShort(); return; }
  if (e.target.closest('[data-later-open]')) { go('later'); return; }
  var fileBtn = e.target.closest('[data-file]');
  if (fileBtn) { s.review.file = Number(fileBtn.getAttribute('data-file')); s.review.line = 0; reviewMove('open'); return; }
  var nr = e.target.closest('[data-rev]');
  if (nr) { reviewKey(nr.getAttribute('data-rev')); return; }
  var pickBox = page === 'library' && e.target.closest('.mark');
  if (pickBox) { var pr = e.target.closest('.row').getAttribute('data-id'); if (s.libPicked[pr]) delete s.libPicked[pr]; else s.libPicked[pr] = true; render(); return; }
  var lineEl = e.target.closest('[data-line]');
  if (lineEl) { s.review.line = Number(lineEl.getAttribute('data-line')); reviewMove(''); return; }
  var r = e.target.closest('.row');
  if (!r) return;
  var id = r.getAttribute('data-id');
  if (page === 'task') { page = 'today'; }
  setCurrent(id);
  if (page === 'inbox' && e.target.closest('[data-box]')) togglePick(id);
  render();
});
$('detail').addEventListener('click', function (e) {
  var gk = e.target.closest('[data-k]');
  if (gk) { var kk = gk.getAttribute('data-k'); if (page === 'day') actDay(kk); else if (page === 'run') actRun(kk); else if (page === 'meetings') actMeetings(kk); else if (page === 'meeting') actMeeting(kk); else if (page === 'settings') actSettings(kk); else if (page === 'later') actLater(kk); else if (page === 'outbox') actOutbox(kk); else if (page === 'library') actLibrary(kk); else if (page === 'reviews') actReviews(kk); else if (page === 'agents') actAgents(kk); else if (page === 'pages') actPages(kk); else if (page === 'knowledge') actKnowledge(kk); else if (page === 'run') actRun(kk); return; }
  var cm = e.target.closest('[data-com]');
  if (cm) { var picked = comById(cm.getAttribute('data-com')); s.review.cur = picked.id; if (picked.file >= 0) { s.review.file = picked.file; s.review.line = picked.at; } render(); return; }
  var rv = e.target.closest('[data-rev]');
  if (rv) { reviewKey(rv.getAttribute('data-rev')); return; }
  var tr = e.target.closest('.row.task');
  if (tr) { s.taskCursor = tr.getAttribute('data-id'); page = 'task'; render(); return; }
  var b = e.target.closest('[data-act]');
  if (b) actToday(b.getAttribute('data-act'));
  var c = e.target.closest('[data-tri]');
  if (c) triage(c.getAttribute('data-tri'));
  var t = e.target.closest('[data-task]');
  if (t) actTask(t.getAttribute('data-task'));
  var pk = e.target.closest('[data-pack]');
  if (pk) packKey(pk.getAttribute('data-pack'));
  var it = e.target.closest('[data-item]');
  if (it) { s.pack.cur = Number(it.getAttribute('data-item')); packKey('x'); }
});
