[package]
name = "loomd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
axum.workspace = true
# `stream::unfold` for the SSE stream of `GET /v1/events`.
futures-util.workspace = true
clap.workspace = true
# The local date of the priority list: the system time zone (`TZ`, `/etc/localtime`) and the
# zoneinfo files, read at each ranked list. jiff is already compiled for loom-core.
jiff = { workspace = true, features = ["std", "tz-system", "tzdb-zoneinfo"] }
loom-api.workspace = true
loom-config.workspace = true
# Forge API bases and the token type (shared with the MR clients).
loom-forge.workspace = true
# Origin of the events loomd records (actor, machine) and its random source.
loom-core.workspace = true
# Repository discovery, identity, contexts and scan changes (ADR-0012).
loom-repo.workspace = true
# The repository index `index.db` (ADR-0012).
loom-store.workspace = true
loom-telemetry.workspace = true
# Auto-upgrade: discovery, decision, download, pre-flight, swap, update state (ADR-0011).
loom-update.workspace = true
miette.workspace = true
# Hand edits of `task.md`: notified within a second instead of polling every task file.
notify.workspace = true
# `statvfs`: free space of the volume of the loom home (already in the tree through gix and tempfile).
# `uname`: the host name, which names the machine in `machine.toml` at first start.
rustix = { workspace = true, features = ["system"] }
# Running version for the update decision.
semver.workspace = true
serde.workspace = true
# Bodies of the task endpoints are checked key by key before they are read (`NewTask` flattens
# its kind and status, so serde cannot reject unknown keys), and error details are JSON.
serde_json.workspace = true
# `sync`: the updater thread asks the server to stop after an upgrade (oneshot channel).
# Errors of the forge token resolver (already in the tree through the library crates).
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "sync", "time"] }
tracing.workspace = true
# `GET /user` of the forge credential check, with the TLS configuration of loom-update (already
# the HTTP client of the updater and of telemetry, ADR-0016).
ureq.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
jsonschema.workspace = true
schemars.workspace = true
tempfile.workspace = true
# Captures the logs and spans of the forge check, to show that they never hold the token.
tracing-subscriber.workspace = true

[lints]
workspace = true
