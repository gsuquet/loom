[package]
name = "loom"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
clap.workspace = true
crossterm.workspace = true
futures-util.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
# The local date of relative due dates (`loom add --due +3d`), as loomd reads it.
jiff = { workspace = true, features = ["std", "tz-system", "tzdb-zoneinfo"] }
loom-api.workspace = true
loom-config.workspace = true
# `parse_task_md`: `loom edit` checks the saved file before loomd reads it.
loom-core.workspace = true
# `find_root` and the context rules: resolution of `<repo>` and `loom repo doctor`.
loom-repo.workspace = true
loom-telemetry.workspace = true
loom-update.workspace = true
miette.workspace = true
ratatui.workspace = true
# `loom upgrade --version` and the running version.
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# `process`: the `ssh` checks of `loom repo doctor`, killed at their deadline.
tokio = { workspace = true, features = ["time"] }
tracing.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
# In-process loomd router for the trace propagation test.
axum.workspace = true
# Fixture release archives in the `upgrade` tests.
flate2.workspace = true
jsonschema.workspace = true
loomd.workspace = true
opentelemetry.workspace = true
# Decodes the OTLP requests the binaries send to a fake collector.
opentelemetry-proto.workspace = true
opentelemetry_sdk = { workspace = true, features = ["testing"] }
prost.workspace = true
schemars.workspace = true
serde_json.workspace = true
tar.workspace = true
tempfile.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
