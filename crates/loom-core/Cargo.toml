[package]
name = "loom-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# Calendar dates (`due`, `waiting_until`); no time zone database, no system clock.
jiff = { workspace = true, features = ["serde"] }
# `jiff02`: JSON Schema of `jiff::civil::Date`.
schemars = { workspace = true, features = ["jiff02"] }
serde.workspace = true
# `events.jsonl` lines, and the bridge from TOML values to the serde forms of the domain types.
serde_json.workspace = true
thiserror.workspace = true
# `task.md` frontmatter, rewritten key by key.
toml_edit.workspace = true

[lints]
workspace = true
