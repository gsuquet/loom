[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/gsuquet/loom"
publish = false

[workspace.dependencies]
assert_cmd = "2.2"
clap = { version = "4.5", features = ["derive"] }
jsonschema = { version = "0.58", default-features = false }
loom-api = { path = "crates/loom-api" }
miette = "7.6"
schemars = "1.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# Allowed in tests through clippy.toml.
unwrap_used = "deny"
expect_used = "deny"
