# Loom Workspace Tooling & Task Automation (mise)
# https://mise.jdx.dev

[tools]
rust = { version = "1.99.0", components = ["clippy", "rustfmt"] }
cargo-deny = "0.20.2"
typos = "1.50.2"
gitleaks = "8.30.1"
actionlint = "1.7.12"
shellcheck = "0.11.0"
# Desktop app spike: build and test only, nothing ships with the app.
node = "26.8.1"
npm = "12.1.0"
# Release workflow: signing (minisign) and Linux musl cross-builds (zig, cargo-zigbuild).
minisign = "0.12"
zig = "0.15.2"
"aqua:rust-cross/cargo-zigbuild" = "0.23.4"

[env]
RUST_BACKTRACE = "1"
CARGO_TERM_COLOR = "always"

[tasks.fmt]
description = "Format the workspace"
run = "cargo fmt --all"

[tasks.fmt-check]
description = "Check formatting"
run = "cargo fmt --all -- --check"

[tasks.clippy]
description = "Lint the workspace, warnings are errors"
run = "cargo clippy --workspace --all-targets --locked -- -D warnings"

[tasks.test]
description = "Run the workspace tests"
run = "cargo test --workspace --locked"

[tasks.docs]
description = "Regenerate the generated reference docs (CLI reference, JSON Schemas)"
run = "cargo test --workspace --locked"
env = { LOOM_UPDATE_DOCS = "1" }

[tasks.typos]
description = "Check spelling"
run = "typos"

[tasks.deny]
description = "Check advisories, licenses, bans and sources"
run = "cargo deny --locked check"

[tasks.gitleaks]
description = "Scan the working tree for secrets"
run = "gitleaks dir . --no-banner --redact"

[tasks.actionlint]
description = "Lint GitHub Actions workflows"
run = "actionlint"

[tasks.shellcheck]
description = "Lint shell scripts, including the bash integration printed by `loom shell-init bash`"
run = "shellcheck dist/*.sh crates/loom/src/shell/init.bash fixtures/forge/scenario.sh"

[tasks.test-install]
description = "Test dist/install.sh against fake releases on a local fake API"
run = "sh dist/test-install.sh"

[tasks.e2e]
description = "End-to-end upgrade scenario on real builds: install, upgrade, failed auto-upgrade, rollback (slow, not part of check)"
run = "bash dist/e2e-upgrade.sh"

[tasks.otel-dev]
description = "Run a local trace backend in the foreground: Jaeger, in memory, OTLP/HTTP on localhost:4318, UI on http://localhost:16686"
# Installed when the task runs, not by `mise install`: CI does not need it. Checksums in mise.lock.
tools = { "github:jaegertracing/jaeger" = "2.21.0" }
run = "jaeger"

[tasks.check]
description = "Quality gate: every check above"
depends = ["fmt-check", "clippy", "test", "typos", "deny", "gitleaks", "actionlint", "shellcheck", "test-install"]

[tasks.spike-app-install]
description = "Spike: build the desktop app and install it, ad-hoc signed, into ~/Applications. It does not run the app."
run = "bash apps/desktop/scripts/install-app.sh"

[tasks.spike-sandbox]
description = "Spike: start a sandbox loomd with fake data in ~/.cache/loom-spike, in the foreground"
run = "bash apps/desktop/scripts/sandbox.sh"

[tasks.spike-bench]
description = "Spike: build the e2e app and run the real-app test here, with the frame figures. Screen unlocked; it needs no permission. The window stays on top for about a minute."
run = "bash apps/desktop/scripts/bench.sh"
