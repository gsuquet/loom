# Loom Workspace Tooling & Task Automation (mise)
# https://mise.jdx.dev

[tools]
rust = { version = "1.99.0", components = ["clippy", "rustfmt"] }
cargo-deny = "0.20.2"
typos = "1.50.2"
gitleaks = "8.30.1"
actionlint = "1.7.12"
shellcheck = "0.11.0"
# Release workflow: signing (minisign) and Linux musl cross-builds (zig, cargo-zigbuild).
minisign = "0.12"
zig = "0.15.2"
"aqua:rust-cross/cargo-zigbuild" = "0.23.4"

[env]
RUST_BACKTRACE = "1"
CARGO_TERM_COLOR = "always"

[tasks.fmt]
description = "Format the workspace"
run = "cargo fmt --all"

[tasks.fmt-check]
description = "Check formatting"
run = "cargo fmt --all -- --check"

[tasks.clippy]
description = "Lint the workspace, warnings are errors"
run = "cargo clippy --workspace --all-targets --locked -- -D warnings"

[tasks.test]
description = "Run the workspace tests"
run = "cargo test --workspace --locked"

[tasks.docs]
description = "Regenerate the generated reference docs (CLI reference, JSON Schemas)"
run = "cargo test --workspace --locked"
env = { LOOM_UPDATE_DOCS = "1" }

[tasks.typos]
description = "Check spelling"
run = "typos"

[tasks.deny]
description = "Check advisories, licenses, bans and sources"
run = "cargo deny --locked check"

[tasks.gitleaks]
description = "Scan the working tree for secrets"
run = "gitleaks dir . --no-banner --redact"

[tasks.actionlint]
description = "Lint GitHub Actions workflows"
run = "actionlint"

[tasks.shellcheck]
description = "Lint shell scripts"
run = "shellcheck dist/*.sh"

[tasks.test-install]
description = "Test dist/install.sh against fake releases on a local fake API"
run = "sh dist/test-install.sh"

[tasks.check]
description = "Quality gate: every check above"
depends = ["fmt-check", "clippy", "test", "typos", "deny", "gitleaks", "actionlint", "shellcheck", "test-install"]
