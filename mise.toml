[tools]
go = "1.27.3"
golangci-lint = "2.15.0"
gofumpt = "0.12.0"
# Pinned here, not in go.mod: go.mod lists only runtime deps (architecture_test.go allowlist).
"go:golang.org/x/vuln/cmd/govulncheck" = "1.9.0"

[env]
CGO_ENABLED = "0"

[tasks.build]
description = "Build bin/loom with the version from git describe"
run = '''
go build -trimpath \
  -ldflags "-s -w -X main.version=$(git describe --tags --always --dirty 2>/dev/null || echo dev)" \
  -o bin/loom ./cmd/loom
'''

[tasks.test]
description = "Run all tests in random order (no network)"
run = "go test -shuffle=on ./..."

[tasks."test:race"]
description = "Run all tests in random order with the race detector (cgo for the test build only; CI runs this)"
# -race needs cgo; the released binary stays CGO_ENABLED=0 (ADR 0004).
env = { CGO_ENABLED = "1" }
run = "go test -race -shuffle=on ./..."

[tasks.vuln]
description = "govulncheck ./... (downloads the vulnerability DB, so not part of test; CI runs it)"
run = "govulncheck ./..."

[tasks.golden]
description = "Rewrite golden files (review the diff before committing)"
# -update is only defined in packages with golden tests; `go test ./... -update` fails elsewhere.
run = "go test ./internal/cli ./internal/contexts -update"

[tasks.lint]
description = "go mod tidy check + go vet + golangci-lint run + gofumpt check (golangci-lint fmt --diff)"
run = ["go mod tidy -diff", "go vet ./...", "golangci-lint run ./...", "golangci-lint fmt --diff ./..."]

[tasks.fmt]
description = "Format all Go files with gofumpt"
run = "gofumpt -l -w ."

[tasks.loc]
description = "Report non-test LOC per package and enforce the size budget"
run = "sh scripts/loc.sh"
