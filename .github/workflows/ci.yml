name: CI

on:
  push:
    branches: [main] # PR branches are covered by pull_request
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint, test (race), loc, vuln (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs with --locked because mise.lock is committed (pinned versions and checksums).
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      # `:::` separates tasks; without it extra words are passed as task arguments.
      # test:race runs the same tests as `test`, plus the race detector.
      - run: "mise run lint ::: test:race ::: loc ::: vuln"
