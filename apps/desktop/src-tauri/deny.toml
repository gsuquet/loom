# Only for this workspace. The allow-list is the decided one; the named exceptions are the MPL-2.0
# crates and the others the graph really has, unmodified. See the PR report for the list.
[graph]
all-features = true
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu"]

[advisories]
ignore = []

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[licenses]
confidence-threshold = 0.9
allow = ["MIT", "Apache-2.0", "Unicode-3.0"]
exceptions = [
  # MPL-2.0, unmodified: CSS parsing of tauri-utils (dom_query), and dirs-sys of tauri.
  { crate = "cssparser", allow = ["MPL-2.0"] },
  { crate = "cssparser-macros", allow = ["MPL-2.0"] },
  { crate = "dtoa-short", allow = ["MPL-2.0"] },
  { crate = "selectors", allow = ["MPL-2.0"] },
  { crate = "option-ext", allow = ["MPL-2.0"] },
  # Asset compression of tauri-codegen.
  { crate = "brotli", allow = ["BSD-3-Clause"] },
  { crate = "alloc-no-stdlib", allow = ["BSD-3-Clause"] },
  { crate = "alloc-stdlib", allow = ["BSD-3-Clause"] },
  # Build-time and e2e only: the router of the WebDriver plugin, hasher, target names.
  { crate = "matchit", allow = ["BSD-3-Clause"] },
  { crate = "foldhash", allow = ["Zlib"] },
  { crate = "target-lexicon", allow = ["Apache-2.0 WITH LLVM-exception"] },
]
