# Own workspace and lockfile: this spike stays out of the root Cargo workspace.
[workspace]
members = [".", "gen-types"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
publish = false

[workspace.lints.rust]
# Tried at forbid; see the PR report.
unsafe_code = "forbid"

[package]
name = "loom-desktop"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "loom_desktop"
path = "src/lib.rs"

[[bin]]
name = "loom-desktop"
path = "src/main.rs"

[features]
# The WebDriver server for the real-app test. It is off in every release build.
e2e = ["dep:tauri-plugin-wdio-webdriver"]
# Passed by the Tauri CLI: serve the embedded frontend, not the dev server.
custom-protocol = ["tauri/custom-protocol"]

[lints]
workspace = true

[build-dependencies]
tauri-build = { version = "=2.7.4", default-features = false , features = [] }

[dependencies]
# Window, webview, IPC.
tauri = { version = "=2.12.5", features = ["macos-private-api"] }
# The OS notification, criterion 8.
tauri-plugin-notification = "=2.8.0"
# HTTP/1.1 over the unix socket, as crates/loom/src/client.rs.
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
tokio = { version = "1", features = ["net", "time", "rt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tauri-plugin-wdio-webdriver = { version = "=1.5.1", optional = true }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt"] }

[profile.release]
codegen-units = 16
lto = "off"
strip = "symbols"
