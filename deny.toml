# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true
# The release targets (docs/reference/releases.md): dependencies of other platforms
# (Windows, Android, wasm) are never built, so their licenses and advisories do not apply.
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "aarch64-unknown-linux-musl",
    "x86_64-unknown-linux-musl",
]

[advisories]
# RustSec advisories: vulnerable, unmaintained and yanked crates fail the check.
yanked = "deny"

[licenses]
# Permissive licenses compatible with the MIT-licensed project.
allow = ["MIT", "Apache-2.0", "Unicode-3.0"]
confidence-threshold = 0.9

# axum's router; BSD-3-Clause is permissive and MIT-compatible. Allowed for this crate only.
[[licenses.exceptions]]
crate = "matchit"
allow = ["BSD-3-Clause"]

# TLS stack of the updater's HTTP client (ureq + rustls, `loom-update`). ISC, BSD-3-Clause and
# CDLA-Permissive-2.0 (Mozilla's root certificates in webpki-roots) are permissive and
# MIT-compatible. Allowed for these crates only.
[[licenses.exceptions]]
crate = "ring"
allow = ["ISC"]

[[licenses.exceptions]]
crate = "rustls-webpki"
allow = ["ISC"]

[[licenses.exceptions]]
crate = "untrusted"
allow = ["ISC"]

[[licenses.exceptions]]
crate = "subtle"
allow = ["BSD-3-Clause"]

[licenses.private]
# Workspace crates are not published (`publish = false`).
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
