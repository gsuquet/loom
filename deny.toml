# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true
# The release targets (docs/reference/releases.md): dependencies of other platforms
# (Windows, Android, wasm) are never built, so their licenses and advisories do not apply.
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "aarch64-unknown-linux-musl",
    "x86_64-unknown-linux-musl",
]

[advisories]
# RustSec advisories: vulnerable, unmaintained and yanked crates fail the check.
yanked = "deny"

[licenses]
# Permissive licenses compatible with the MIT-licensed project.
allow = ["MIT", "Apache-2.0", "Unicode-3.0"]
confidence-threshold = 0.9

# axum's router; BSD-3-Clause is permissive and MIT-compatible. Allowed for this crate only.
[[licenses.exceptions]]
crate = "matchit"
allow = ["BSD-3-Clause"]

# TLS stack of the HTTP clients (ureq + rustls, configured in `loom_update::tls`, used by the
# updater and the OTLP exporter). ISC and BSD-3-Clause are permissive and
# MIT-compatible. Allowed for these crates only.
[[licenses.exceptions]]
crate = "ring"
allow = ["ISC"]

[[licenses.exceptions]]
crate = "rustls-webpki"
allow = ["ISC"]

[[licenses.exceptions]]
crate = "untrusted"
allow = ["ISC"]

[[licenses.exceptions]]
crate = "subtle"
allow = ["BSD-3-Clause"]

# Default hasher of `hashbrown`, enabled by `gix-hashtable` (`gix-config` of `loom-repo`). Zlib is
# permissive and MIT-compatible. Allowed for this crate only.
[[licenses.exceptions]]
crate = "foldhash"
allow = ["Zlib"]

# `gix` repository state reads (`loom-repo`, ADR-0008): object decompression (`zlib-rs`, through
# `gix-zlib`) and the `working-tree-encoding` conversion of the status (`encoding_rs`, through
# `gix-filter`, BSD-3-Clause for its WHATWG data). Zlib and BSD-3-Clause are permissive and
# MIT-compatible. Allowed for these crates only.
[[licenses.exceptions]]
crate = "zlib-rs"
allow = ["Zlib"]

[[licenses.exceptions]]
crate = "encoding_rs"
allow = ["BSD-3-Clause"]

[licenses.private]
# Workspace crates are not published (`publish = false`).
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
